name: Mobile UI visual smoke

on:
  push:
    branches: ["main", "release/**"]
    paths:
      - "index.html"
      - "panel.html"
      - "klient.html"
      - "track.html"
      - "assets/*.css"
      - "assets/site.js"
      - "assets/home-story.js"\n      - "assets/showcase-meetings-1.0.22.js"
      - "assets/panel.js"
      - ".github/workflows/mobile-visual-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "panel.html"
      - "klient.html"
      - "track.html"
      - "assets/*.css"
      - "assets/site.js"
      - "assets/home-story.js"
      - "assets/panel.js"
      - ".github/workflows/mobile-visual-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/serviceos-http.log 2>&1 &
          echo $! > /tmp/serviceos-http.pid
      - name: Capture
        run: |
          cat > visual-capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('visual-check',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const phone=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await phone.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
          await phone.waitForTimeout(900);
          await phone.screenshot({path:'visual-check/landing-phone-top.png'});
          await phone.locator('#modules').scrollIntoViewIfNeeded();
          await phone.waitForTimeout(250);
          await phone.screenshot({path:'visual-check/landing-phone-modules.png'});
          await phone.locator('#connect').scrollIntoViewIfNeeded();
          await phone.waitForTimeout(250);
          await phone.screenshot({path:'visual-check/landing-phone-connect.png'});

          const desktop=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          await desktop.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
          await desktop.waitForTimeout(900);
          await desktop.locator('#modules').scrollIntoViewIfNeeded();
          await desktop.waitForTimeout(250);
          await desktop.screenshot({path:'visual-check/landing-desktop-modules.png'});
          await desktop.locator('#meetings').scrollIntoViewIfNeeded();
          await desktop.waitForTimeout(250);
          await desktop.screenshot({path:'visual-check/landing-desktop-meetings.png'});
          await desktop.locator('[data-meeting22-scene="live"]').click();
          await desktop.waitForTimeout(120);
          await desktop.screenshot({path:'visual-check/landing-desktop-meeting-room.png'});

          const loaderPage=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await loaderPage.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
          await loaderPage.screenshot({path:'visual-check/landing-phone-loader.png'});

          const panel=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await panel.route('**/assets/panel.js',route=>route.abort());
          await panel.goto('http://127.0.0.1:4173/panel.html',{waitUntil:'domcontentloaded'});
          await panel.screenshot({path:'visual-check/panel-phone-loader.png'});
          await panel.evaluate(()=>{
            document.getElementById('panelBoot')?.remove();
            const select=document.getElementById('panelPointSelect');
            if(select)select.innerHTML='<option>Punkt Nowogard</option>';
            document.getElementById('panelAccountButton').textContent='BM';
            const show=(id)=>{
              document.querySelectorAll('.panel-view').forEach(v=>v.classList.toggle('active',v.id===id));
            };
            window.__showPanelView=show;
            show('view-home');
            document.getElementById('kpiActive').textContent='4';
            document.getElementById('kpiTransfers').textContent='2';
            document.getElementById('panelFocus').innerHTML='<button type="button"><div><span>NASTĘPNA AKCJA · #1042</span><strong>Rozpocznij naprawę.</strong><small>iPhone 14 Pro · Diagnoza · termin dzisiaj 14:30</small></div><b>→</b></button>';
            document.getElementById('homeOrders').innerHTML='<article class="panel-order-card workflow-active"><div class="panel-order-top"><div class="panel-order-number"><strong>#1042</strong><small>20.09 09:40</small></div><div class="panel-order-main"><strong>Anna Kowalska</strong><span>iPhone 14 Pro</span><small>Zlecenie serwisowe</small></div><div class="panel-status-pill">Diagnoza</div></div><div class="mobile-workflow-strip"><div><span>Etap 3/10</span><strong>Diagnoza</strong><progress max="100" value="30"></progress></div><div><span>Następna akcja</span><strong>Rozpocznij naprawę</strong></div><em class="action">DZIAŁAJ TERAZ</em></div><button>Otwórz szczegóły →</button></article>';
          });
          await panel.waitForTimeout(350);
          await panel.screenshot({path:'visual-check/panel-phone-home.png'});

          await panel.evaluate(()=>window.__showPanelView('view-new'));
          await panel.waitForTimeout(350);
          await panel.screenshot({path:'visual-check/panel-phone-new.png'});

          await panel.evaluate(()=>{
            window.__showPanelView('view-orders');
            document.getElementById('orderWorkflowFilters').innerHTML='<button class="active">Wszystkie <b>4</b></button><button>Działaj teraz <b>2</b></button><button>W drodze <b>1</b></button><button>Gotowe <b>1</b></button>';
            document.getElementById('ordersList').innerHTML='<article class="panel-order-card workflow-overdue"><div class="panel-order-top"><div class="panel-order-number"><strong>#1042</strong><small>20.09 09:40</small></div><div class="panel-order-main"><strong>Anna Kowalska</strong><span>iPhone 14 Pro</span><small>Zlecenie serwisowe</small></div><div class="panel-status-pill">Diagnoza</div></div><div class="mobile-workflow-strip"><div><span>Etap 3/10</span><strong>Diagnoza</strong><progress max="100" value="30"></progress></div><div><span>Następna akcja</span><strong>Rozpocznij naprawę</strong></div><em class="overdue">PO TERMINIE</em></div><button>Otwórz szczegóły →</button></article>';
          });
          await panel.waitForTimeout(350);
          await panel.screenshot({path:'visual-check/panel-phone-orders.png'});

          await panel.evaluate(()=>{
            window.__showPanelView('view-transfers');
            document.getElementById('transfersList').innerHTML='<article class="panel-transfer-card"><div class="transfer-icon">⇄</div><div class="transfer-content"><strong>#1041 · Piotr Nowak</strong><span>Samsung S24</span><small>Do serwisu · Punkt Nowogard → Serwis główny · W drodze · dzisiaj 10:12</small></div><div class="transfer-actions"><button class="mini-action primary">Dostarczono</button><button class="mini-action">Anuluj</button></div></article>';
          });
          await panel.waitForTimeout(350);
          await panel.screenshot({path:'visual-check/panel-phone-transfers.png'});

          await panel.evaluate(()=>{
            window.__showPanelView('view-more');
            document.querySelectorAll('#view-more [hidden]').forEach(el=>el.hidden=false);
            document.querySelectorAll('.panel-bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.panelNav==='more'));
          });
          await panel.waitForTimeout(350);
          await panel.screenshot({path:'visual-check/panel-phone-more-owner.png'});

          await panel.evaluate(()=>document.getElementById('accountDialog').showModal());
          await panel.waitForTimeout(100);
          await panel.screenshot({path:'visual-check/panel-phone-account.png'});
          await panel.evaluate(()=>document.getElementById('accountDialog').close());

          await panel.evaluate(()=>{
            document.getElementById('view-admin').hidden=false;
            window.__showPanelView('view-admin');
            document.getElementById('adminSessions').textContent='6';
            document.getElementById('adminBlocked').textContent='0';
            document.getElementById('adminServices').textContent='2';
            document.getElementById('adminTransfers').textContent='1';
          });
          await panel.waitForTimeout(350);
          await panel.screenshot({path:'visual-check/panel-phone-admin.png'});

          const login=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await login.goto('http://127.0.0.1:4173/index.html?login=1',{waitUntil:'networkidle'});
          await login.waitForTimeout(250);
          await login.screenshot({path:'visual-check/landing-phone-login.png'});

          const customer=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await customer.goto('http://127.0.0.1:4173/klient.html',{waitUntil:'domcontentloaded'});
          await customer.screenshot({path:'visual-check/customer-phone-login.png'});

          const metrics=await phone.evaluate(()=>({
            width:document.documentElement.clientWidth,
            scrollWidth:document.documentElement.scrollWidth,
            mobileAnchor:getComputedStyle(document.querySelector('.mobile-anchor-nav')).display,
            laptop:getComputedStyle(document.querySelector('.showcase-laptop')).display,
            phoneMock:getComputedStyle(document.querySelector('.showcase-phone')).display
          }));
          if(metrics.scrollWidth>metrics.width+1)throw new Error('Landing horizontal overflow: '+JSON.stringify(metrics));
          if(metrics.mobileAnchor==='none')throw new Error('Mobile landing must expose quick anchor navigation: '+JSON.stringify(metrics));
          if(metrics.laptop==='none')throw new Error('Mobile landing must keep a readable product preview: '+JSON.stringify(metrics));
          if(metrics.phoneMock!=='none')throw new Error('Nested phone mock should be hidden on narrow screens: '+JSON.stringify(metrics));

          const panelMetrics=await panel.evaluate(()=>({
            width:document.documentElement.clientWidth,
            scrollWidth:document.documentElement.scrollWidth,
            navVisible:[...document.querySelectorAll('.panel-bottom-nav button')].filter(x=>getComputedStyle(x).display!=='none').length
          }));
          if(panelMetrics.scrollWidth>panelMetrics.width+1)throw new Error('Panel horizontal overflow: '+JSON.stringify(panelMetrics));
          if(panelMetrics.navVisible!==5)throw new Error('Expected five mobile tabs: '+JSON.stringify(panelMetrics));
          const targets=await panel.evaluate(()=>[...document.querySelectorAll('.panel-bottom-nav button')].filter(x=>getComputedStyle(x).display!=='none').map(x=>({w:x.getBoundingClientRect().width,h:x.getBoundingClientRect().height})));
          if(targets.some(x=>x.w<44||x.h<44))throw new Error('Mobile tab target below 44px: '+JSON.stringify(targets));

          const responsiveViewports=[
            {name:'phone-320',width:320,height:720},
            {name:'phone-360',width:360,height:800},
            {name:'phone-390',width:390,height:844},
            {name:'phone-430',width:430,height:932},
            {name:'tablet-768',width:768,height:1024},
            {name:'desktop-1366',width:1366,height:768},
            {name:'desktop-1440',width:1440,height:900},
            {name:'desktop-1920',width:1920,height:1080}
          ];
          const assertNoHorizontalOverflow=async(page,label)=>{
            const metric=await page.evaluate(()=>{
              const width=document.documentElement.clientWidth;
              const scrollWidth=document.documentElement.scrollWidth;
              const culprits=[...document.querySelectorAll('body *')].map((el)=>{
                const r=el.getBoundingClientRect();
                return {tag:el.tagName.toLowerCase(),id:el.id||'',cls:String(el.className||'').slice(0,100),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width)};
              }).filter(x=>x.right>width+1||x.left<-1).sort((a,b)=>Math.max(b.right-width,-b.left)-Math.max(a.right-width,-a.left)).slice(0,12);
              return {width,scrollWidth,culprits};
            });
            if(metric.scrollWidth>metric.width+1)throw new Error(label+' horizontal overflow: '+JSON.stringify(metric));
          };
          for(const viewport of responsiveViewports){
            const landingMatrix=await browser.newPage({viewport:{width:viewport.width,height:viewport.height},deviceScaleFactor:1});
            await landingMatrix.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            await landingMatrix.waitForTimeout(300);
            await assertNoHorizontalOverflow(landingMatrix,'Landing '+viewport.name);
            await landingMatrix.screenshot({path:'visual-check/matrix-'+viewport.name+'-landing.png'});
            await landingMatrix.close();

            const customerMatrix=await browser.newPage({viewport:{width:viewport.width,height:viewport.height},deviceScaleFactor:1});
            await customerMatrix.goto('http://127.0.0.1:4173/klient.html',{waitUntil:'domcontentloaded'});
            await customerMatrix.waitForTimeout(200);
            await assertNoHorizontalOverflow(customerMatrix,'Portal klienta '+viewport.name);
            await customerMatrix.screenshot({path:'visual-check/matrix-'+viewport.name+'-customer.png'});
            await customerMatrix.close();

            const supportMatrix=await browser.newPage({viewport:{width:viewport.width,height:viewport.height},deviceScaleFactor:1});
            await supportMatrix.route('**/assets/panel.js',route=>route.abort());
            await supportMatrix.goto('http://127.0.0.1:4173/panel.html',{waitUntil:'domcontentloaded'});
            await supportMatrix.evaluate((showStaff)=>{
              document.getElementById('panelBoot')?.remove();
              document.querySelectorAll('.panel-view').forEach(view=>view.classList.toggle('active',view.id==='view-support'));
              const state=document.getElementById('mobileSupportState');
              if(state){
                state.className='mobile-support-state joined';
                state.innerHTML='<strong>Anna Kowalska dołączyła do rozmowy</strong><span>Bot nadal jest dostępny. Wybierz odbiorcę kolejnej wiadomości.</span><div class="mobile-help-targets"><button class="active bot">Bot ServiceOS</button><button class="consultant">Konsultant</button></div>';
              }
              const messages=document.getElementById('mobileHelpMessages');
              if(messages)messages.innerHTML='<article class="mobile-help-message assistant"><div><strong>Bot ServiceOS</strong><time>21:40</time></div><p>Jasne — pomogę Ci to sprawdzić. Najpierw zweryfikujmy status zlecenia, a jeśli będzie potrzebna decyzja człowieka, konsultant jest już dostępny.</p><button class="mobile-help-action">Otwórz zlecenie →</button></article><article class="mobile-help-message user"><div><strong>Użytkownik</strong><time>21:41</time></div><small class="mobile-help-channel-badge consultant">Do konsultanta</small><p>Proszę sprawdzić wyjątek w tym zleceniu.</p></article>';
              document.querySelectorAll('.support-staff-only').forEach(el=>{el.hidden=!showStaff;});
              if(showStaff){
                const presence=document.getElementById('mobileSupportPresence');
                if(presence)presence.innerHTML='<article class="mobile-presence-row waiting"><i></i><div><strong>Jan Nowak</strong><span>Serwisant · telefon</span></div><b>CZEKA</b></article>';
              }
            },viewport.width>=768);
            await supportMatrix.waitForTimeout(150);
            await assertNoHorizontalOverflow(supportMatrix,'Panel pomocy '+viewport.name);
            if(viewport.width<=430){
              const targets=await supportMatrix.evaluate(()=>[...document.querySelectorAll('.mobile-help-targets button')].map(el=>({w:el.getBoundingClientRect().width,h:el.getBoundingClientRect().height})));
              if(targets.some(x=>x.w<44||x.h<44))throw new Error('Hotline target below 44px at '+viewport.name+': '+JSON.stringify(targets));
            }
            await supportMatrix.screenshot({path:'visual-check/matrix-'+viewport.name+'-support.png'});
            await supportMatrix.close();
          }

          await browser.close();
          EOF
          node visual-capture.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mobile-visual-check
          path: visual-check/*.png
          if-no-files-found: error
          retention-days: 1
