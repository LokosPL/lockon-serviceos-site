name: ServiceOS responsive visual smoke

on:
  push:
    paths:
      - "index.html"
      - "panel.html"
      - "klient.html"
      - "track.html"
      - "assets/*.css"
      - "assets/*.js"
      - "sw.js"
      - ".github/workflows/mobile-visual-check.yml"
      - ".github/workflows/verify.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "panel.html"
      - "klient.html"
      - "track.html"
      - "assets/*.css"
      - "assets/*.js"
      - "sw.js"
      - ".github/workflows/mobile-visual-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serviceos-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/serviceos-http.log 2>&1 &
          echo $! > /tmp/serviceos-http.pid

      - name: Run responsive and interaction smoke
        run: |
          cat > visual-capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('visual-check',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const base='http://127.0.0.1:4173';

          const errors=[];
          const watchErrors=async(page,label)=>{
            await page.route('https://api.github.com/repos/LokosPL/LockOn-Hub/releases/latest',(route)=>route.fulfill({
              status:200,
              contentType:'application/json',
              body:JSON.stringify({
                tag_name:'v1.0.0',
                name:'LockOn ServiceOS v1.0.0',
                assets:[{name:'LockOn-ServiceOS-Setup.exe',browser_download_url:'https://example.test/LockOn-ServiceOS-Setup.exe',size:73400320,digest:'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'}]
              })
            }));
            page.on('pageerror',(error)=>errors.push(label+' pageerror: '+error.message));
            page.on('console',(message)=>{
              if(message.type()==='error') errors.push(label+' console: '+message.text());
            });
          };

          const assertNoHorizontalOverflow=async(page,label)=>{
            const metric=await page.evaluate(()=>{
              const width=document.documentElement.clientWidth;
              const scrollWidth=document.documentElement.scrollWidth;
              const culprits=[...document.querySelectorAll('body *')].map((el)=>{
                const r=el.getBoundingClientRect();
                return {
                  tag:el.tagName.toLowerCase(),
                  id:el.id||'',
                  cls:String(el.className||'').slice(0,90),
                  left:Math.round(r.left),
                  right:Math.round(r.right),
                  width:Math.round(r.width)
                };
              }).filter((x)=>x.right>width+1||x.left<-1)
                .sort((a,b)=>Math.max(b.right-width,-b.left)-Math.max(a.right-width,-a.left))
                .slice(0,10);
              return {width,scrollWidth,culprits};
            });
            if(metric.scrollWidth>metric.width+1){
              throw new Error(label+' horizontal overflow: '+JSON.stringify(metric));
            }
          };

          const assertMobileTargets=async(page,label)=>{
            const targets=await page.evaluate(()=>[...document.querySelectorAll(
              'button:not([tabindex="-1"]),a.button,.mobile-menu-action'
            )].map((el)=>{
              const r=el.getBoundingClientRect();
              const style=getComputedStyle(el);
              return {
                text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,60),
                w:Math.round(r.width),
                h:Math.round(r.height),
                visible:style.display!=='none'&&style.visibility!=='hidden'&&r.width>0&&r.height>0
              };
            }).filter((x)=>x.visible));
            const tooSmall=targets.filter((x)=>x.h<44||x.w<44);
            if(tooSmall.length) throw new Error(label+' targets below 44px: '+JSON.stringify(tooSmall));
          };

          const viewports=[
            {name:'phone-320',width:320,height:720},
            {name:'phone-360',width:360,height:800},
            {name:'phone-390',width:390,height:844},
            {name:'phone-430',width:430,height:932},
            {name:'tablet-768',width:768,height:1024},
            {name:'desktop-1366',width:1366,height:768},
            {name:'desktop-1440',width:1440,height:900},
            {name:'desktop-1920',width:1920,height:1080}
          ];

          for(const viewport of viewports){
            const page=await browser.newPage({viewport:{width:viewport.width,height:viewport.height},deviceScaleFactor:1});
            await watchErrors(page,'Landing '+viewport.name);
            await page.goto(base+'/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(750);
            await assertNoHorizontalOverflow(page,'Landing '+viewport.name);
            if(viewport.width<=430) await assertMobileTargets(page,'Landing '+viewport.name);
            await page.screenshot({path:'visual-check/matrix-'+viewport.name+'-landing.png'});
            await page.close();
          }

          const desktop=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          await watchErrors(desktop,'Landing interactions');
          await desktop.goto(base+'/index.html',{waitUntil:'domcontentloaded'});
          await desktop.waitForTimeout(650);

          await desktop.locator('[data-preview="service"]').first().click();
          if(!await desktop.locator('[data-preview-screen="service"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Service preview did not activate');
          await desktop.locator('[data-preview="meetings"]').first().click();
          if(!await desktop.locator('[data-preview-screen="meetings"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Meetings preview did not activate');
          await desktop.locator('#modules').scrollIntoViewIfNeeded();
          await desktop.waitForTimeout(750);
          await desktop.locator('.modules-os-window .os-sidebar [data-module="clients"]').click();
          await desktop.waitForTimeout(350);
          if(!await desktop.locator('[data-module-panel="clients"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Clients module did not activate');
          await desktop.screenshot({path:'visual-check/desktop-modules-clients.png'});

          for(const key of ['browser','service','clients','meetings','finance','admin','support','settings','help']){
            const heroNav=desktop.locator('.hero-os-window [data-preview="'+key+'"]').first();
            if(!await heroNav.isVisible()) throw new Error('Hero is missing interactive view: '+key);
            await heroNav.click();
            if(!await desktop.locator('.hero-os-window [data-preview-screen="'+key+'"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Hero did not open '+key);
          }
          await desktop.locator('.hero-os-window [data-preview="start"]').first().click();
          if(!await desktop.locator('.hero-live-dock').isVisible()) throw new Error('Persistent meeting dock is missing in hero');
          await desktop.locator('.hero-live-dock').click();
          if(!await desktop.locator('.hero-os-window [data-preview-screen="meetings"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Hero live dock did not return to meeting');
          await desktop.screenshot({path:'visual-check/desktop-hero-full-demo.png'});

          for(const key of ['start','service','clients','meetings','finance','admin','browser','support','help','settings']){
            const moduleNav=desktop.locator('.modules-os-window [data-module="'+key+'"]').first();
            if(!await moduleNav.isVisible()) throw new Error('Modules demo is missing '+key);
            await moduleNav.click();
            if(!await desktop.locator('.modules-os-window [data-module-panel="'+key+'"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Modules demo did not open '+key);
          }
          await desktop.locator('.modules-os-window [data-module="service"]').first().click();

          await desktop.locator('#roles').scrollIntoViewIfNeeded();
          await desktop.waitForTimeout(750);

          for(const key of ['browser','service','meetings','earnings','administration','customers','support','settings']){
            const nav=desktop.locator('[data-role-nav-key="'+key+'"]');
            if(!await nav.isVisible()) throw new Error('Owner role is missing navigation: '+key);
            await nav.click();
            if(!await desktop.locator('[data-role-screen="'+key+'"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Role menu did not open '+key);
          }

          await desktop.locator('[data-role-help]').click();
          if(!await desktop.locator('[data-role-screen="help"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Role help did not open');

          await desktop.locator('[data-role-account-action]').click();
          if(await desktop.locator('[data-role-account-popover]').evaluate((el)=>el.hidden)) throw new Error('Role account popover did not open');
          await desktop.locator('[data-role-account-close]').click();

          await desktop.locator('[data-role-preview="tech"]').click();
          if((await desktop.locator('[data-role-title]').textContent())!=='Serwisant') throw new Error('Role simulator did not switch to technician');
          if(await desktop.locator('[data-role-nav-key="administration"]').isVisible()) throw new Error('Technician role still exposes Administration preview');
          if(!await desktop.locator('[data-role-nav-key="earnings"]').isVisible()) throw new Error('Technician role lost own earnings');
          await desktop.locator('[data-role-nav-key="service"]').click();
          if(!await desktop.locator('[data-role-screen="service"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Technician service screen did not open');
          await desktop.screenshot({path:'visual-check/desktop-role-technician.png'});

          await desktop.locator('[data-role-preview="front"]').click();
          if(await desktop.locator('[data-role-nav-key="earnings"]').isVisible()) throw new Error('Front desk role still exposes earnings');
          if(!await desktop.locator('[data-role-nav-key="customers"]').isVisible()) throw new Error('Front desk role lost customers');
          await desktop.locator('[data-role-nav-key="customers"]').click();
          await desktop.screenshot({path:'visual-check/desktop-role-frontdesk-customers.png'});

          await desktop.locator('[data-role-preview="owner"]').click();
          await desktop.waitForTimeout(180);
          await desktop.screenshot({path:'visual-check/desktop-roles-wow.png'});

          await desktop.locator('#meetings').scrollIntoViewIfNeeded();
          await desktop.waitForTimeout(750);
          await desktop.locator('[data-meeting-theater]').click();
          if(!await desktop.locator('[data-meeting-room]').evaluate((el)=>el.classList.contains('theater-mode'))) throw new Error('Meeting theater mode did not activate');
          const micButton=desktop.locator('.meeting-controls button').first();
          await micButton.click();
          if(await micButton.evaluate((el)=>el.classList.contains('active'))) throw new Error('Meeting microphone control did not toggle');
          await micButton.click();
          await desktop.locator('[data-meeting-side="people"]').click();
          await desktop.waitForTimeout(350);
          if(!await desktop.locator('[data-meeting-side-panel="people"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Meeting participants panel did not activate');
          await desktop.screenshot({path:'visual-check/desktop-meeting-theater.png'});

          await desktop.locator('#connect').scrollIntoViewIfNeeded();
          await desktop.waitForTimeout(750);
          await desktop.locator('[data-phone-step="4"]').click();
          await desktop.waitForTimeout(350);
          if(!await desktop.locator('[data-phone-screen="4"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Phone step 4 did not activate');
          await desktop.screenshot({path:'visual-check/desktop-phone-step4.png'});

          await desktop.locator('#security').scrollIntoViewIfNeeded();
          await desktop.waitForTimeout(750);
          await desktop.screenshot({path:'visual-check/desktop-security-wow.png'});

          await desktop.locator('#start').scrollIntoViewIfNeeded();
          await desktop.waitForTimeout(750);
          await desktop.screenshot({path:'visual-check/desktop-start-wow.png'});
          await desktop.screenshot({path:'visual-check/desktop-full-page.png',fullPage:true});
          await assertNoHorizontalOverflow(desktop,'Landing interactions');
          await desktop.close();

          const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await watchErrors(mobile,'Landing mobile interactions');
          await mobile.goto(base+'/index.html',{waitUntil:'domcontentloaded'});
          await mobile.waitForTimeout(550);
          await mobile.locator('[data-menu-toggle]').click();
          await mobile.waitForTimeout(350);
          if(!await mobile.locator('[data-site-nav]').evaluate((el)=>el.classList.contains('menu-open'))) throw new Error('Mobile menu did not open');
          await assertMobileTargets(mobile,'Mobile menu');
          await mobile.screenshot({path:'visual-check/mobile-menu.png'});
          await mobile.locator('[data-menu-toggle]').click();

          await mobile.locator('#modules').scrollIntoViewIfNeeded();
          await mobile.waitForTimeout(500);
          const mobileModuleButton=mobile.locator('.module-mobile-tabs [data-module="clients"]');
          if(!await mobileModuleButton.isVisible()) throw new Error('Mobile module controls are not visible');
          await mobileModuleButton.click();
          if(!await mobile.locator('[data-module-panel="clients"]').evaluate((el)=>el.classList.contains('active'))) throw new Error('Mobile clients module did not activate');
          await assertMobileTargets(mobile,'Mobile module tabs');

          for(const [id,name] of [['modules','modules'],['roles','roles'],['meetings','meetings'],['connect','phone'],['security','security'],['start','start']]){
            await mobile.locator('#'+id).scrollIntoViewIfNeeded();
            await mobile.waitForTimeout(750);
            await assertNoHorizontalOverflow(mobile,'Mobile '+name);
            await mobile.screenshot({path:'visual-check/mobile-'+name+'.png'});
          }
          await mobile.close();

          const onboarding=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await watchErrors(onboarding,'Onboarding');
          await onboarding.goto(base+'/index.html',{waitUntil:'domcontentloaded'});
          await onboarding.evaluate(()=>localStorage.removeItem('lockon.employee.onboarding.v1'));
          await onboarding.reload({waitUntil:'domcontentloaded'});
          await onboarding.locator('#start').scrollIntoViewIfNeeded();
          for(const id of ['agreeEmployee','agreeRules','agreeMobile']) await onboarding.locator('#'+id).check();
          await onboarding.locator('#acceptOnboarding').click();
          const accepted=await onboarding.evaluate(()=>localStorage.getItem('lockon.employee.onboarding.v1'));
          if(accepted!=='accepted') throw new Error('Onboarding state was not persisted');
          if(await onboarding.locator('#acceptOnboarding').textContent()!=='✓ ServiceOS odblokowany') throw new Error('Onboarding UI did not unlock');
          await onboarding.close();

          const login=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await watchErrors(login,'Phone pairing dialog');
          await login.goto(base+'/index.html?login=1',{waitUntil:'domcontentloaded'});
          await login.waitForTimeout(300);
          if(!await login.locator('#webLoginDialog').evaluate((el)=>el.open)) throw new Error('Phone pairing dialog did not open');
          await login.screenshot({path:'visual-check/mobile-phone-pairing-dialog.png'});
          await login.close();

          const reducedContext=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});
          const reduced=await reducedContext.newPage();
          await watchErrors(reduced,'Reduced motion');
          await reduced.goto(base+'/index.html',{waitUntil:'domcontentloaded'});
          await reduced.waitForTimeout(150);
          const revealOpacity=await reduced.locator('.reveal').first().evaluate((el)=>getComputedStyle(el).opacity);
          if(revealOpacity!=='1') throw new Error('Reduced-motion reveal is not immediately visible');
          await reducedContext.close();

          for(const viewport of [{name:'phone',width:390,height:844},{name:'desktop',width:1440,height:900}]){
            const panel=await browser.newPage({viewport:{width:viewport.width,height:viewport.height}});
            await panel.route('**/assets/panel.js',(route)=>route.abort());
            await panel.goto(base+'/panel.html',{waitUntil:'domcontentloaded'});
            await panel.evaluate(()=>document.getElementById('panelBoot')?.remove());
            await assertNoHorizontalOverflow(panel,'Panel '+viewport.name);
            await panel.close();

            const customer=await browser.newPage({viewport:{width:viewport.width,height:viewport.height}});
            await customer.route('**/assets/customer-portal.js',(route)=>route.abort());
            await customer.goto(base+'/klient.html',{waitUntil:'domcontentloaded'});
            await assertNoHorizontalOverflow(customer,'Customer '+viewport.name);
            await customer.close();

            const track=await browser.newPage({viewport:{width:viewport.width,height:viewport.height}});
            await track.route('**/assets/track.js',(route)=>route.abort());
            await track.goto(base+'/track.html',{waitUntil:'domcontentloaded'});
            await assertNoHorizontalOverflow(track,'Tracking '+viewport.name);
            await track.close();
          }

          if(errors.length) throw new Error('Browser errors detected:\n'+errors.join('\n'));
          await browser.close();
          EOF
          node visual-capture.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: serviceos-responsive-visual-smoke
          path: visual-check/*.png
          if-no-files-found: error
          retention-days: 3
