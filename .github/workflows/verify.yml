name: Verify LockOn ServiceOS site

on:
  push:
    paths:
      - "index.html"
      - "privacy.html"
      - "terms.html"
      - "signing.html"
      - "panel.html"
      - "klient.html"
      - "track.html"
      - "assets/**"
      - "sw.js"
      - ".github/workflows/verify.yml"
      - ".github/workflows/mobile-visual-check.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: lockon-site-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check assets/serviceos-app-site.js
          node --check assets/google-auth.js
          node --check assets/google-config.js
          node --check assets/panel.js
          node --check assets/track.js
          node --check assets/customer-portal.js
          node --check assets/ui-2026.js
          node --check sw.js

      - name: Verify app-parity landing structure
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assets/serviceos-site.css' index.html
          grep -q 'assets/serviceos-app-site.js' index.html
          grep -q 'Cały serwis' index.html
          grep -q 'Bez chaosu' index.html
          grep -q 'id="day"' index.html
          grep -q 'id="modules"' index.html
          grep -q 'id="roles"' index.html
          grep -q 'id="meetings"' index.html
          grep -q 'id="connect"' index.html
          grep -q 'id="security"' index.html
          grep -q 'id="start"' index.html
          grep -q 'class="os-window hero-os-window"' index.html
          grep -q 'class="os-titlebar"' index.html
          grep -q 'class="os-sidebar"' index.html
          grep -q 'class="os-start-hero"' index.html
          grep -q 'Wszystkie punkty' index.html
          grep -q 'Przeglądarka' index.html
          grep -q 'Spotkania i szkolenia' index.html
          grep -q 'data-preview="start"' index.html
          grep -q 'data-preview-screen="meetings"' index.html
          grep -q 'modules-os-window' index.html
          grep -q 'class="module-mobile-tabs"' index.html
          grep -q 'data-module="service"' index.html
          grep -q 'data-module-panel="tools"' index.html
          grep -q 'class="role-simulator' index.html
          grep -q 'data-role-preview="owner"' index.html
          grep -q 'data-role-preview="front"' index.html
          grep -q 'data-role-title' index.html
          grep -q 'data-role-nav-key="browser"' index.html
          grep -q 'data-role-nav-key="support"' index.html
          grep -q 'data-role-screen="settings"' index.html
          grep -q 'data-role-screen="help"' index.html
          grep -q 'data-role-account' index.html
          grep -q 'Bartłomiej' index.html
          grep -q 'data-role-select' index.html
          grep -q 'class="full-meeting-room"' index.html
          grep -q 'data-meeting-room' index.html
          grep -q 'data-meeting-theater' index.html
          grep -q 'data-meeting-side="chat"' index.html
          grep -q 'data-phone-step="4"' index.html
          grep -q 'data-phone-screen="4"' index.html
          grep -q 'prefers-reduced-motion' assets/serviceos-site.css
          grep -q '@media(max-width:430px)' assets/serviceos-site.css
          grep -q '@media(max-width:360px)' assets/serviceos-site.css
          grep -q '218px' assets/serviceos-site.css
          grep -q 'height:38px' assets/serviceos-site.css
          grep -q 'IntersectionObserver' assets/serviceos-app-site.js
          grep -q "lockon.employee.onboarding.v1" assets/serviceos-app-site.js
          grep -q "data-role-preview" assets/serviceos-app-site.js
          grep -q "activateRoleScreen" assets/serviceos-app-site.js
          grep -q "data-role-account-action" assets/serviceos-app-site.js
          grep -q "data-live-clock" assets/serviceos-app-site.js
          grep -q "serviceWorker.register" assets/serviceos-app-site.js
          test "$(grep -o '<main[ >]' index.html | wc -l)" -eq 1
          test "$(grep -o '</main>' index.html | wc -l)" -eq 1
          ! grep -q 'assets/serviceos-app-site.css' index.html
          ! grep -q 'style="' index.html
          ! grep -q "'unsafe-inline'" index.html
          test ! -e assets/home-v2.css
          test ! -e assets/home-v2.js
          test ! -e assets/home-story.css
          test ! -e assets/home-story.js
          test ! -e assets/showcase-1.0.21.css
          test ! -e assets/showcase-1.0.22.css
          test ! -e assets/showcase-meetings-1.0.22.js

      - name: Verify central auth, phone pairing and onboarding
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'auth/google-web' assets/google-auth.js
          grep -q 'website/redeem' assets/google-auth.js
          grep -q 'lockonapi.compute' assets/google-config.js
          ! grep -q 'googleClientId' assets/google-config.js
          ! grep -q 'apps.googleusercontent.com' assets/google-config.js
          grep -q 'lockonapi.compute' index.html
          grep -q 'navLoginButton' index.html
          grep -q 'navPanelLink' index.html
          grep -q 'webLoginDialog' index.html
          grep -q 'webAuthCodeForm' index.html
          grep -q 'webAuthCode' index.html
          grep -q 'agreeEmployee' index.html
          grep -q 'agreeRules' index.html
          grep -q 'agreeMobile' index.html
          grep -q 'data-requires-onboarding' index.html
          ! grep -q 'googleSignInButton' index.html
          ! grep -q 'accounts.google.com' index.html
          grep -q 'localStorage.getItem(tokenKey)' assets/google-auth.js
          grep -q 'localStorage.getItem(tokenKey)' assets/panel.js

      - name: Verify worker, customer and tracking portals
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'orderWorkflowFilters' panel.html
          grep -q 'Cena orientacyjna' panel.html
          grep -q 'id="view-more"' panel.html
          grep -q 'id="view-support"' panel.html
          grep -q 'data-panel-nav="support"' panel.html
          grep -q 'id="mobileHelpForm"' panel.html
          grep -q 'id="mobileRequestConsultant"' panel.html
          grep -q '/service/orders' assets/panel.js
          grep -q '/service/transfers' assets/panel.js
          grep -q '/admin/logout-all' assets/panel.js
          grep -q '/support/presence' assets/panel.js
          grep -q '/service/scan' assets/panel.js
          grep -q 'public/customer-portal/login' assets/customer-portal.js
          grep -q 'public/customer-portal/google/login' assets/customer-portal.js
          grep -q 'public/customer-portal/settings' assets/customer-portal.js
          grep -q 'customerAccessChoice' klient.html
          grep -q 'customerSettingsForm' klient.html
          grep -q 'noindex,nofollow,noarchive' klient.html
          grep -q 'public/service-track' assets/track.js
          grep -q 'noindex,nofollow,noarchive' track.html
          ! grep -q 'href="index.html"' track.html
          ! grep -q 'href="index.html"' klient.html

      - name: Verify legal shell, CSP and cache
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assets/serviceos-app-site.css' privacy.html
          grep -q 'assets/serviceos-app-site.css' terms.html
          grep -q 'assets/serviceos-app-site.css' signing.html
          grep -q 'Połączenie telefonu z panelem WWW odbywa się wyłącznie' privacy.html
          grep -q "serviceos-shell-v37" sw.js
          grep -q 'serviceos-site.css' sw.js
          grep -q 'serviceos-app-site.css' sw.js
          grep -q 'serviceos-app-site.js' sw.js
          grep -q 'google-auth.js' sw.js
          grep -q 'track.html' sw.js
          grep -q 'klient.html' sw.js
          grep -q "object-src 'none'" index.html
          grep -q "frame-src 'none'" index.html
          grep -q "base-uri 'none'" index.html
          grep -q "form-action 'none'" index.html
