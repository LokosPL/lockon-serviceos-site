name: Verify LockOn ServiceOS site

on:
  push:
    paths:
      - "index.html"
      - "privacy.html"
      - "terms.html"
      - "signing.html"
      - "assets/**"
      - "sw.js"
      - ".github/workflows/verify.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: lockon-site-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check assets/serviceos-app-site.js
          node --check assets/google-auth.js
          node --check assets/google-config.js
          node --check assets/panel.js
          node --check assets/track.js
          node --check assets/customer-portal.js
          node --check assets/ui-2026.js
          node --check sw.js

      - name: Verify rebuilt landing contracts
        shell: bash
        run: |
          grep -q 'assets/serviceos-app-site.css' index.html
          grep -q 'assets/serviceos-app-site.js' index.html
          grep -q 'Cały serwis' index.html
          grep -q 'Od wejścia klienta' index.html
          grep -q 'id="day"' index.html
          grep -q 'id="modules"' index.html
          grep -q 'id="roles"' index.html
          grep -q 'id="meetings"' index.html
          grep -q 'id="connect"' index.html
          grep -q 'id="security"' index.html
          grep -q 'id="start"' index.html
          grep -q 'mobile-anchor-nav' index.html
          grep -q 'showcase-laptop' index.html
          grep -q 'showcase-phone' index.html
          grep -q 'workday-demo' index.html
          grep -q 'showcase-journey-grid' index.html
          grep -q 'showcase-role-grid' index.html
          grep -q 'data-meeting22-scene="live"' index.html
          grep -q 'Tryb kinowy' index.html
          grep -q 'SCHEDULED ≠ LIVE' index.html
          grep -q 'Połącz urządzenie' index.html
          grep -q 'data-preview-screen="start"' index.html
          grep -q 'data-module-panel="service"' index.html
          grep -q 'prefers-reduced-motion' assets/serviceos-app-site.css
          grep -q '@media(max-width:760px)' assets/serviceos-app-site.css
          grep -q 'IntersectionObserver' assets/serviceos-app-site.js
          grep -q 'lockon.employee.onboarding.v1' assets/serviceos-app-site.js
          ! grep -q 'style="' index.html
          ! grep -q '50/50' index.html

      - name: Verify central auth and onboarding
        shell: bash
        run: |
          ! grep -q 'auth/google-web' assets/google-auth.js
          grep -q 'website/redeem' assets/google-auth.js
          grep -q 'lockonapi.compute' assets/google-config.js
          ! grep -q 'googleClientId' assets/google-config.js
          ! grep -q 'apps.googleusercontent.com' assets/google-config.js
          grep -q 'lockonapi.compute' index.html
          grep -q 'navLoginButton' index.html
          grep -q 'navPanelLink' index.html
          grep -q 'webAuthCodeForm' index.html
          grep -q 'webAuthCode' index.html
          grep -q 'agreeEmployee' index.html
          grep -q 'agreeRules' index.html
          grep -q 'agreeMobile' index.html
          grep -q 'data-requires-onboarding' index.html
          ! grep -q 'googleSignInButton' index.html
          ! grep -q 'accounts.google.com' index.html
          grep -q 'localStorage.getItem(tokenKey)' assets/google-auth.js
          grep -q 'localStorage.getItem(tokenKey)' assets/panel.js

      - name: Verify worker, customer and tracking portals
        shell: bash
        run: |
          grep -q 'orderWorkflowFilters' panel.html
          grep -q 'Cena orientacyjna' panel.html
          grep -q 'id="view-more"' panel.html
          grep -q 'id="view-support"' panel.html
          grep -q 'data-panel-nav="support"' panel.html
          grep -q 'id="mobileHelpForm"' panel.html
          grep -q 'id="mobileRequestConsultant"' panel.html
          grep -q '/service/orders' assets/panel.js
          grep -q '/service/transfers' assets/panel.js
          grep -q '/admin/logout-all' assets/panel.js
          grep -q '/support/presence' assets/panel.js
          grep -q '/service/scan' assets/panel.js
          grep -q 'public/customer-portal/login' assets/customer-portal.js
          grep -q 'public/customer-portal/google/login' assets/customer-portal.js
          grep -q 'public/customer-portal/settings' assets/customer-portal.js
          grep -q 'customerAccessChoice' klient.html
          grep -q 'customerSettingsForm' klient.html
          grep -q 'noindex,nofollow,noarchive' klient.html
          grep -q 'public/service-track' assets/track.js
          grep -q 'noindex,nofollow,noarchive' track.html
          ! grep -q 'href="index.html"' track.html
          ! grep -q 'href="index.html"' klient.html

      - name: Verify security/legal shell and cache
        shell: bash
        run: |
          grep -q 'assets/serviceos-app-site.css' privacy.html
          grep -q 'assets/serviceos-app-site.css' terms.html
          grep -q 'assets/serviceos-app-site.css' signing.html
          grep -q 'Połączenie telefonu z panelem WWW odbywa się wyłącznie' privacy.html
          grep -q 'serviceos-shell-v31' sw.js
          grep -q 'serviceos-app-site.css' sw.js
          grep -q 'serviceos-app-site.js' sw.js
          grep -q 'track.html' sw.js
          grep -q 'klient.html' sw.js
